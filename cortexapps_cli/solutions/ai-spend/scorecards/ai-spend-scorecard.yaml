tag: ai-spend-scorecard
name: AI Spend Budget Compliance
description: Tracks whether team AI spend stays within the team's weekly budget, with bronze for data tracking, silver for near-budget compliance, and gold for on-budget status.
draft: false
notifications:
  enabled: true
  scoreDropNotificationsEnabled: true
exemptions:
  enabled: true
  autoApprove: false
  userSpecificNotifications: false
evaluation:
  window: 24
ladder:
  name: Default Ladder
  levels:
    - name: Bronze
      rank: 1
      description: Team is tracking AI spend with the ai-spend custom metric and has a weekly budget set.
      color: "#CD7F32"
    - name: Silver
      rank: 2
      description: Team AI spend is within 25% of the weekly budget.
      color: "#C0C0C0"
    - name: Gold
      rank: 3
      description: Team AI spend is at or under the weekly budget.
      color: "#D7AC58"
filter:
  kind: GENERIC
  types:
    include:
      - team
  query: "hasGroup(\"ai-spend-demo\")"
rules:
  - title: AI spend data is being tracked
    description: The team has ai-spend custom metric data within the last year, indicating the sync script has run at least once. Adjust the P1Y lookback to a tighter window (e.g. P8D) once the weekly sync is running consistently.
    expression: customMetrics(key="ai-spend", lookback = duration("P1Y")).length > 0
    weight: 1
    level: Bronze

  - title: Weekly budget is defined
    description: The team has a weekly AI budget set via the ai-budget-weekly custom data key. Without a budget, compliance cannot be measured.
    expression: custom("ai-budget-weekly") != null
    weight: 1
    level: Bronze

  - title: Spend is within 25% of budget
    description: The team's weekly AI spend is no more than 25% over the budget. The P8D lookback averages the last week of data — adjust to match your sync frequency if needed.
    expression: customMetrics(key="ai-spend", lookback=duration("P8D")).map((m) => m.value).average() <= jq(custom("ai-budget-weekly"), ". | tonumber") * 1.25
    weight: 1
    level: Silver

  - title: Spend is at or under budget
    description: The team's weekly AI spend is at or under the budget. This is the target state for all teams. The P8D lookback averages the last week of data — adjust to match your sync frequency if needed.
    expression: customMetrics(key="ai-spend", lookback=duration("P8D")).map((m) => m.value).average() <= jq(custom("ai-budget-weekly"), ". | tonumber")
    weight: 1
    level: Gold

name: Cortex Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cortex_callback_url:
        description: 'Cortex async workflow callback URL (set automatically when triggered via Cortex workflow)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Hello, Cortex deploys!"

  notify-cortex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Register deploy in Cortex
        continue-on-error: true
        run: |
          curl -s -f -X POST \
            "${{ secrets.CORTEX_BASE_URL }}/api/v1/catalog/github-actions-demo/deploys" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg sha '${{ github.sha }}' \
              --arg actor '${{ github.actor }}' \
              --arg branch '${{ github.ref_name }}' \
              --arg run_id '${{ github.run_id }}' \
              --arg run_url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
              --arg trigger '${{ github.event_name }}' \
              '{
                sha: $sha,
                environment: "production",
                type: "DEPLOY",
                title: ("Triggered by " + $actor),
                deployer: {name: $actor},
                customData: {branch: $branch, runId: $run_id, runUrl: $run_url, trigger: $trigger}
              }')"

      - name: Notify Cortex workflow callback
        if: ${{ always() && inputs.cortex_callback_url != '' }}
        run: |
          if [ "${{ needs.build.result }}" = "success" ]; then
            CORTEX_STATUS="SUCCESS"
          elif [ "${{ needs.build.result }}" = "cancelled" ]; then
            CORTEX_STATUS="CANCELLED"
          else
            CORTEX_STATUS="FAILURE"
          fi

          CALLBACK_URL="${{ inputs.cortex_callback_url }}"
          CORTEX_API_KEY="${{ secrets.CORTEX_API_KEY }}"

          _callback() {
            curl -s -f -X POST "$CALLBACK_URL" \
              -H "Authorization: Bearer $CORTEX_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$1"
          }

          # Update 1 of 2
          _callback "$(jq -n '{status: "IN_PROGRESS", message: "Update 1 of 2: sleeping for 10 seconds", output: {}}')"
          sleep 10

          # Update 2 of 2
          _callback "$(jq -n '{status: "IN_PROGRESS", message: "Update 2 of 2: finishing up", output: {}}')"
          sleep 10

          # Final callback
          _callback "$(jq -n \
            --arg status "$CORTEX_STATUS" \
            --arg sha '${{ github.sha }}' \
            --arg run_id '${{ github.run_id }}' \
            --arg run_url '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
            '{
              status: $status,
              message: "",
              output: {sha: $sha, run_id: $run_id, run_url: $run_url}
            }')"

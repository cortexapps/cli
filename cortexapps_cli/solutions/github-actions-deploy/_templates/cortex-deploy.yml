name: Cortex Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cortex_callback_url:
        description: 'Cortex async workflow callback URL (set automatically when triggered via Cortex workflow)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Hello, Cortex deploys!"

  notify-cortex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Register deploy in Cortex
        run: |
          TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Record the deploy event
          curl -s -f -X POST \
            "${{ secrets.CORTEX_BASE_URL }}/api/v1/catalog/github-actions-demo/deploys" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sha\": \"${{ github.sha }}\",
              \"environment\": \"production\",
              \"type\": \"DEPLOY\",
              \"title\": \"Triggered by ${{ github.actor }}\",
              \"deployer\": { \"name\": \"${{ github.actor }}\" },
              \"customData\": {
                \"branch\": \"${{ github.ref_name }}\",
                \"runId\": \"${{ github.run_id }}\",
                \"runUrl\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"trigger\": \"${{ github.event_name }}\"
              }
            }"

          # Post deploy-count metric (powers the Deploy Health scorecard)
          curl -s -f -X POST \
            "${{ secrets.CORTEX_BASE_URL }}/api/v1/eng-intel/custom-metrics/deploy-count/entity/github-actions-demo" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"timestamp\": \"${TIMESTAMP}\", \"value\": 1}"

      - name: Notify Cortex workflow callback
        if: ${{ always() && inputs.cortex_callback_url != '' }}
        run: |
          curl -s -f -X POST \
            "${{ inputs.cortex_callback_url }}" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"SUCCESS\",
              \"message\": \"\",
              \"output\": {
                \"conclusion\": \"success\",
                \"sha\": \"${{ github.sha }}\",
                \"run_id\": \"${{ github.run_id }}\",
                \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }
            }"

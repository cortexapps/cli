name: Cortex Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cortex_callback_url:
        description: 'Cortex async workflow callback URL (set automatically when triggered via Cortex workflow)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build
        run: echo "Hello, Cortex deploys!"

  notify-cortex:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Register deploy in Cortex
        run: |
          curl -s -f -X POST \
            "${{ secrets.CORTEX_BASE_URL }}/api/v1/catalog/github-actions-demo/deploys" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"sha\": \"${{ github.sha }}\",
              \"environment\": \"production\",
              \"type\": \"DEPLOY\",
              \"title\": \"Triggered by ${{ github.actor }}\",
              \"deployer\": { \"name\": \"${{ github.actor }}\" },
              \"customData\": {
                \"branch\": \"${{ github.ref_name }}\",
                \"runId\": \"${{ github.run_id }}\",
                \"runUrl\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"trigger\": \"${{ github.event_name }}\"
              }
            }"

      - name: Notify Cortex workflow callback
        if: ${{ always() && inputs.cortex_callback_url != '' }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            CORTEX_STATUS="SUCCESS"
          elif [ "${{ job.status }}" = "cancelled" ]; then
            CORTEX_STATUS="CANCELLED"
          else
            CORTEX_STATUS="FAILURE"
          fi

          curl -s -f -X POST \
            "${{ inputs.cortex_callback_url }}" \
            -H "Authorization: Bearer ${{ secrets.CORTEX_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"status\": \"${CORTEX_STATUS}\",
              \"message\": \"\",
              \"output\": {
                \"conclusion\": \"${{ job.status }}\",
                \"sha\": \"${{ github.sha }}\",
                \"run_id\": \"${{ github.run_id }}\",
                \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }
            }"

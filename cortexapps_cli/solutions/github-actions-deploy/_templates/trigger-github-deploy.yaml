name: Trigger GitHub Actions Deploy
tag: github-actions-trigger-deploy
description: |
  Triggers the Cortex deploy workflow on GitHub Actions and waits for the deployment to complete.
  GitHub Actions calls back to Cortex when finished, surfacing the result directly in this workflow run.
isDraft: false
isRunnableViaApi: true
filter:
  type: GLOBAL
variables:
- slug: github-owner
  type: STRING
  defaultValue: ""
  description: GitHub organization or username that owns the repository.
- slug: repo-name
  type: STRING
  defaultValue: ""
  description: Name of the GitHub repository to trigger the deploy workflow in.
runResponseTemplate: |
  # GitHub Actions Deploy

  Deploy complete for **{{variables.github-owner}}/{{variables.repo-name}}**.

  [View GitHub Actions runs](https://github.com/{{variables.github-owner}}/{{variables.repo-name}}/actions)

  ---

  ## GitHub workflow used for this deploy

  ```yaml
  name: Cortex Deploy

  on:
    push:
      branches: [main]
    workflow_dispatch:
      inputs:
        cortex_callback_url:
          description: 'Cortex async workflow callback URL (set automatically when triggered via Cortex workflow)'
          required: false
          default: ''

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Build
          run: echo "Hello, Cortex deploys!"

    notify-cortex:
      needs: build
      runs-on: ubuntu-latest
      steps:
        - name: Register deploy in Cortex
          continue-on-error: true
          run: |
            curl -s -f -X POST \
              "$CORTEX_BASE_URL/api/v1/catalog/github-actions-demo/deploys" \
              -H "Authorization: Bearer $CORTEX_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg sha '$GITHUB_SHA' \
                --arg actor '$GITHUB_ACTOR' \
                --arg branch '$GITHUB_REF_NAME' \
                --arg run_id '$GITHUB_RUN_ID' \
                --arg run_url '$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID' \
                --arg trigger '$GITHUB_EVENT_NAME' \
                --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{
                  sha: $sha,
                  timestamp: $timestamp,
                  environment: "production",
                  type: "DEPLOY",
                  title: ("Triggered by " + $actor),
                  deployer: {name: $actor},
                  customData: {branch: $branch, runId: $run_id, runUrl: $run_url, trigger: $trigger}
                }')"

        - name: Notify Cortex workflow callback
          if: always() && inputs.cortex_callback_url != ''
          run: |
            if [ "$NEEDS_BUILD_RESULT" = "success" ]; then
              CORTEX_STATUS="SUCCESS"
            elif [ "$NEEDS_BUILD_RESULT" = "cancelled" ]; then
              CORTEX_STATUS="CANCELLED"
            else
              CORTEX_STATUS="FAILURE"
            fi

            curl -s -f -X POST "$CORTEX_CALLBACK_URL" \
              -H "Authorization: Bearer $CORTEX_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg status "$CORTEX_STATUS" \
                --arg sha '$GITHUB_SHA' \
                --arg run_id '$GITHUB_RUN_ID' \
                --arg run_url '$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID' \
                '{
                  status: $status,
                  message: "",
                  output: {sha: $sha, run_id: $run_id, run_url: $run_url}
                }')"
  ```

actions:
- name: Branch
  slug: branch
  schema:
    branches:
    - name: UI invocation
      slug: ui-invocation
      outgoingAction: inputs
      expression: "variables[\"github-owner\"] == \"\" || variables[\"repo-name\"] == \"\""
      type: CONDITIONAL
    - name: API invocation
      slug: api-invocation
      outgoingAction: pass-through
      expression: "variables[\"github-owner\"] != \"\" && variables[\"repo-name\"] != \"\""
      type: CONDITIONAL
    joiningAction: merge
    type: CONDITIONAL_BRANCH
  outgoingActions:
  - inputs
  - pass-through
  isRootAction: true
- name: Inputs
  slug: inputs
  schema:
    inputs:
    - name: GitHub Owner
      description: GitHub organization or username that owns the repository.
      key: github-owner
      required: true
      defaultValue: null
      placeholder: e.g. my-org
      validationRegex: null
      type: INPUT_FIELD
    - name: Repository Name
      description: Name of the GitHub repository containing the Cortex deploy workflow.
      key: repo-name
      required: true
      defaultValue: null
      placeholder: e.g. cortex-deploy-demo
      validationRegex: null
      type: INPUT_FIELD
    inputOverrides:
    - inputKey: github-owner
      outputVariable: variables.github-owner
      editable: true
      type: VALUE
    - inputKey: repo-name
      outputVariable: variables.repo-name
      editable: true
      type: VALUE
    type: USER_INPUT
  outgoingActions:
  - merge
  isRootAction: false
- name: Pass through
  slug: pass-through
  schema:
    expression: "."
    type: JQ
  outgoingActions:
  - merge
  isRootAction: false
- name: Merge branches
  slug: merge
  schema:
    expression: "."
    type: JQ
  outgoingActions:
  - trigger-deploy
  isRootAction: false
- name: Trigger GitHub Actions Deploy
  slug: trigger-deploy
  schema:
    type: HTTP_REQUEST_ASYNC
    httpMethod: POST
    url: "/repos/{{variables.github-owner}}/{{variables.repo-name}}/actions/workflows/cortex-deploy.yml/dispatches"
    integration: GitHub
    integrationAlias: "PLACEHOLDER_INTEGRATION_ALIAS"
    headers: {}
    payload: '{"ref": "main", "inputs": {"cortex_callback_url": "{{callbackUrl}}"}}'
    timeoutInSeconds: 120
  outgoingActions: []
  isRootAction: false
